{% if comparativo %}
<br><br>
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr class="bg-grey-300 p-1">
                <th>Medida</th>
                <th>Anterior (cm)</th>
                <th>Atual (cm)</th>
                <th>Diferença</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for item in comparativo %}
            <tr>
                <td>{{ item.label }}</td>
                <td>{{ item.v_antigo }}</td>
                <td>{{ item.v_recente }}</td>
                <td class="font-medium text-red-500">{{ item.diff }}</td>
                <td class="{% if item.diff > 0 %} text-orange-400 {% else %} text-blue-400 {%endif%}" >
                    {{ item.status }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endif %}
